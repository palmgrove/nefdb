name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Validate factors and sources
        run: bun run validate

      - name: Run tests
        run: bun run test

      - name: Build package
        run: bun run build

      - name: Build CSV export
        run: bun run build:csv

      - name: Build JSON export
        run: bun run build:json
